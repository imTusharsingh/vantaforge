<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d0f12"><title>VantaForge — workspace</title>
<style>
:root{--bg:#0b0e10;--panel:#14181a;--line:#29302e;--text:#f5f1e8;--muted:#9ba39e;--lime:#c7f36b;--orange:#ff9d6c;--red:#ff867d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 72% -8%,#273328 0,#0b0e10 44%);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.shell{max-width:1480px;margin:auto;padding:22px 30px 50px}.top{height:58px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:800;letter-spacing:-.04em}.mark{width:30px;height:30px;border-radius:10px 10px 10px 3px;background:var(--lime);position:relative;transform:rotate(-8deg)}.mark:after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--bg);right:6px;top:7px}.top-actions{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:13px}.avatar{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#e8bf9e;color:#27170f;font-weight:800}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:42px;padding-top:30px}nav{color:var(--muted)}nav h5{margin:28px 13px 8px;color:#68716c;text-transform:uppercase;letter-spacing:.15em;font-size:10px}nav button{display:flex;width:100%;padding:11px 13px;margin:3px 0;border-radius:9px;background:transparent;color:inherit;text-align:left;align-items:center;gap:10px}nav button:hover,nav button.active{background:#202921;color:var(--lime)}main{min-width:0}.eyebrow{color:var(--lime);text-transform:uppercase;letter-spacing:.15em;font-size:10px;font-weight:800}.page-head{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:27px}.page-head h1{max-width:730px;margin:5px 0 10px;font-size:clamp(32px,4vw,53px);line-height:1.02;letter-spacing:-.06em}.page-head p{margin:0;max-width:690px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:15px}.card{background:rgba(20,24,26,.88);border:1px solid var(--line);border-radius:13px;padding:20px}.span-3{grid-column:span 3}.span-4{grid-column:span 4}.span-5{grid-column:span 5}.span-7{grid-column:span 7}.span-8{grid-column:span 8}.span-12{grid-column:span 12}.card h2{margin:0 0 14px;font-size:18px;letter-spacing:-.025em}.metric{font-size:30px;font-weight:800;letter-spacing:-.06em;margin-top:9px}.label{color:var(--muted);font-size:12px}.chip{display:inline-flex;align-items:center;padding:4px 8px;border-radius:99px;background:#25321f;color:var(--lime);font-size:11px;font-weight:800}.chip.warn{background:#3a281f;color:var(--orange)}.chip.blocked{background:#3a2020;color:var(--red)}.chip.neutral{background:#242a2b;color:#c3cbc5}.row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:13px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.empty{padding:25px 0;text-align:center;color:var(--muted)}.notice,.blocked-box{padding:16px;border:1px solid #5f482f;background:#282019;border-radius:10px;color:#d9b99c}.notice strong,.blocked-box h3{color:#ffb783}.blocked-box h3{margin:0 0 5px}.actions{display:flex;gap:9px;flex-wrap:wrap}.primary,.secondary,.danger{padding:11px 15px;border-radius:8px;font-weight:800}.primary{background:var(--lime);color:#11150e}.secondary{background:#22292a;border:1px solid var(--line);color:var(--text)}.danger{background:#3b2020;color:var(--red);border:1px solid #673a38}.secondary:disabled,.primary:disabled{opacity:.45;cursor:not-allowed}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;background:#0f1314;border:1px solid var(--line);color:var(--text);border-radius:7px;padding:10px}.field textarea{min-height:90px}.check-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.check{display:flex;gap:8px;align-items:center;color:#dbe1db}.check input{accent-color:var(--lime)}.subtle{font-size:12px;color:var(--muted)}.auth{max-width:500px;margin:10vh auto}.auth .brand{margin-bottom:34px}.auth-card{background:rgba(20,24,26,.95);border:1px solid var(--line);border-radius:15px;padding:27px}.auth-card h1{margin:0 0 8px;font-size:32px;letter-spacing:-.05em}.auth-tabs{display:flex;gap:4px;margin:22px 0}.auth-tabs button{padding:8px 12px;border-radius:7px;background:transparent;color:var(--muted)}.auth-tabs button.active{background:#263020;color:var(--lime)}.stack{display:grid;gap:14px}.error{color:var(--red);font-size:13px}.hidden{display:none!important}.workspace-switcher{max-width:220px;background:#101516;color:var(--text);border:1px solid var(--line);padding:8px;border-radius:7px}.tabs-note{margin:-12px 0 18px;color:var(--muted);font-size:13px}.data-table{width:100%;border-collapse:collapse;font-size:13px}.data-table th,.data-table td{text-align:left;padding:11px 7px;border-top:1px solid var(--line);vertical-align:top}.data-table th{color:var(--muted);font-weight:500}.code{font-family:ui-monospace,monospace;font-size:12px;color:#c9d6c9}.toast{position:fixed;right:22px;bottom:22px;max-width:360px;padding:13px 16px;border:1px solid var(--line);border-radius:9px;background:#202827;box-shadow:0 12px 40px #0008}.toast.bad{border-color:#6b3d3b;color:#ffafa8}@media(max-width:950px){.layout{grid-template-columns:1fr;gap:20px}.layout nav{display:flex;overflow:auto;gap:5px}.layout nav h5{display:none}.layout nav button{width:auto;white-space:nowrap}.span-3,.span-4,.span-5,.span-7,.span-8{grid-column:span 12}}@media(max-width:560px){.shell{padding:16px}.top-actions span{display:none}.page-head{display:block}.page-head .actions{margin-top:18px}.form-grid,.check-list{grid-template-columns:1fr}}
</style></head>
<body><div id="root"></div><script>
(()=>{'use strict';const root=document.querySelector('#root');const state={token:null,user:null,workspaces:[],workspace:null,policy:null,providers:[],assets:[],connections:[],analytics:[],page:location.hash.slice(1)||'overview',authMode:'login'};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const apiError=e=>e?.error?.message||e?.message||'The Worker API could not complete this request.';async function api(path,opt={}){const headers={'content-type':'application/json',...(opt.headers||{})};if(state.token)headers.authorization=`Bearer ${state.token}`;const res=await fetch(path,{...opt,headers});let data=null;try{data=await res.json()}catch{}if(!res.ok){const e=new Error(apiError(data));e.payload=data;e.status=res.status;throw e}return data?.data}function toast(msg,bad=false){const el=document.createElement('div');el.className=`toast${bad?' bad':''}`;el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),4500)}function blocker(title,msg){return `<div class="blocked-box"><h3>${esc(title)}</h3><p class="muted">${esc(msg)}</p></div>`}function loading(){root.innerHTML='<div class="auth"><div class="brand"><span class="mark"></span>VantaForge</div><div class="auth-card"><p class="muted">Loading authenticated workspace state…</p></div></div>'}function authView(){root.innerHTML=`<div class="auth"><div class="brand"><span class="mark"></span>VantaForge</div><div class="auth-card"><div class="eyebrow">Creator operations, with evidence</div><h1>${state.authMode==='login'?'Enter your workspace.':'Create your workspace.'}</h1><p class="muted">VantaForge only shows data returned by your authenticated Worker. No sample dashboard is rendered.</p><div class="auth-tabs"><button class="${state.authMode==='login'?'active':''}" data-auth="login">Log in</button><button class="${state.authMode==='signup'?'active':''}" data-auth="signup">Sign up</button></div><form id="auth-form" class="stack"><div class="field ${state.authMode==='signup'?'':'hidden'}"><label>Display name</label><input name="display_name" autocomplete="name"></div><div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" required></div><div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" required minlength="12"></div><button class="primary" type="submit">${state.authMode==='login'?'Log in':'Create account'}</button><div id="auth-error" class="error"></div></form></div></div>`;document.querySelectorAll('[data-auth]').forEach(b=>b.onclick=()=>{state.authMode=b.dataset.auth;authView()});document.querySelector('#auth-form').onsubmit=async e=>{e.preventDefault();const form=new FormData(e.currentTarget);try{const data=await api(`/v1/auth/${state.authMode==='login'?'login':'signup'}`,{method:'POST',body:JSON.stringify(Object.fromEntries(form))});state.token=data.token;state.user=data.user;await loadWorkspaces();render()}catch(error){document.querySelector('#auth-error').textContent=apiError(error.payload)}}}
async function loadWorkspaces(){state.workspaces=await api('/v1/workspaces');if(!state.workspace&&state.workspaces[0])state.workspace=state.workspaces[0];if(state.workspace)await loadWorkspace(state.workspace.id)}async function loadWorkspace(id){state.workspace=state.workspaces.find(w=>w.id===id)||await api(`/v1/workspaces/${id}`);const results=await Promise.allSettled([api(`/v1/workspaces/${id}/policy`),api(`/v1/workspaces/${id}/ai-providers`),api(`/v1/workspaces/${id}/assets`),api(`/v1/workspaces/${id}/publishing-connections`),api(`/v1/workspaces/${id}/analytics`)]);[state.policy,state.providers,state.assets,state.connections,state.analytics]=results.map(r=>r.status==='fulfilled'?r.value:[])}function header(title,copy,action=''){return `<div class="page-head"><div><div class="eyebrow">${esc(state.workspace?.name||'Workspace')} / ${esc(title)}</div><h1>${copy}</h1></div>${action}</div>`}
function overview(){const p=state.policy||{};const verified=(state.providers||[]).find(x=>x.status==='verified');return header('Command center','Operate from what is real.',`<div class="actions"><button class="secondary" data-page="settings">Workspace settings</button><button class="primary" data-page="assets">Add footage</button></div>`)+`<div class="grid"><div class="card span-3"><div class="label">Workspace</div><div class="metric">${esc(state.workspace?.name||'—')}</div><div class="subtle">${esc(state.workspace?.timezone||'Timezone unavailable')}</div></div><div class="card span-3"><div class="label">Automation</div><div class="metric">${esc(p.mode||'—')}</div><div class="subtle">${p.stop_switch?'Stop switch is on':'Stop switch is off'}</div></div><div class="card span-3"><div class="label">Assets recorded</div><div class="metric">${state.assets.length}</div><div class="subtle">Readiness is evaluated per asset</div></div><div class="card span-3"><div class="label">Analytics runs</div><div class="metric">${state.analytics.length}</div><div class="subtle">Persisted Worker runs only</div></div><div class="card span-7"><h2>Workspace readiness</h2><div class="row"><span>AI provider</span>${verified?`<span class="chip">${esc(verified.name)} verified</span>`:'<span class="chip warn">Not verified</span>'}</div><div class="row"><span>Publishing connections</span><span class="chip ${state.connections.length?'':'neutral'}">${state.connections.length?state.connections.filter(c=>c.credential_status==='active').length+' active':'None configured'}</span></div><div class="row"><span>Footage readiness</span><span class="chip neutral">${state.assets.filter(a=>a.status==='ready').length} ready / ${state.assets.length} recorded</span></div></div><div class="card span-5"><h2>Evidence boundary</h2><p class="muted">Metrics, ideas, quality scores and post URLs appear only after the API returns them. Empty collections stay empty.</p><div class="actions"><button class="secondary" data-page="analytics">Open analytics</button><button class="secondary" data-page="review">Open review</button></div></div></div>`}
function assets(){return header('Asset library','Make readiness visible.',`<button class="primary" data-action="upload-help">Upload intent</button>`)+`<div class="grid"><div class="card span-8"><h2>Workspace assets</h2><p class="tabs-note">Rows come from GET /v1/workspaces/:id/assets. No asset means no production-ready footage.</p>${state.assets.length?`<table class="data-table"><thead><tr><th>File</th><th>Readiness</th><th>Licensing</th><th>Scan</th></tr></thead><tbody>${state.assets.map(a=>`<tr><td>${esc(a.original_filename)}<br><span class="subtle">${esc(a.media_type)} · ${a.bytes||'—'} bytes</span></td><td><span class="chip ${a.status==='ready'?'':'blocked'}">${esc(a.status)}</span><br><span class="subtle">${esc(a.blocked_reason||'No blocker returned')}</span></td><td>${esc(a.licensing_status)}<br><span class="subtle">Rights ${a.rights_confirmed?'confirmed':'not confirmed'}</span></td><td>${esc(a.scan_status)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No assets have been returned for this workspace.</div>'}</div><div class="card span-4">${blocker('Upload and scan boundary','The API can create upload intents, but this client does not claim an asset is ready. Completion requires checksum, duration, dimensions and licensing metadata; an unavailable scanner keeps the asset blocked.')}</div></div>`}
function settings(){const p=state.policy||{};const enabled=Array.isArray(p.enabled_capabilities)?p.enabled_capabilities:[];return header('Settings','Keep automation reversible.')+`<div class="grid"><div class="card span-7"><h2>Automation policy</h2><form id="policy-form" class="stack"><div class="form-grid"><div class="field"><label>Mode</label><select name="mode"><option value="assisted" ${p.mode==='assisted'?'selected':''}>Assisted</option><option value="autopilot" ${p.mode==='autopilot'?'selected':''}>Autopilot</option></select></div><div class="field"><label>Review cadence</label><select name="review_mode"><option value="every_short" ${p.review_mode==='every_short'?'selected':''}>Every short</option><option value="after_n_shorts" ${p.review_mode==='after_n_shorts'?'selected':''}>After N shorts</option><option value="none" ${p.review_mode==='none'?'selected':''}>No scheduled review</option></select></div><div class="field"><label>Review after count</label><input name="review_after_count" type="number" min="1" value="${esc(p.review_after_count||'')}"></div><div class="field"><label>Daily spend limit (USD)</label><input name="daily_spend_limit" type="number" min="0" step="0.01" value="${esc(p.daily_spend_limit||'')}"></div><div class="field"><label>Per-job cost limit (USD)</label><input name="per_job_cost_limit" type="number" min="0" step="0.01" value="${esc(p.per_job_cost_limit||'')}"></div></div><div class="field"><label>Enabled capabilities</label><div class="check-list">${['idea_discovery','production','review','publishing','analytics'].map(c=>`<label class="check"><input type="checkbox" name="capability" value="${c}" ${enabled.includes(c)?'checked':''}> ${c.replace('_',' ')}</label>`).join('')}</div></div><label class="check"><input type="checkbox" name="stop_switch" ${p.stop_switch?'checked':''}> Reversible stop switch — prevent new automated work</label><button class="primary" type="submit">Save policy</button></form></div><div class="card span-5"><h2>Workspace</h2><form id="workspace-form" class="stack"><div class="field"><label>Name</label><input name="name" required value="${esc(state.workspace?.name)}"></div><div class="field"><label>Timezone</label><input name="timezone" required value="${esc(state.workspace?.timezone)}"></div><button class="secondary" type="submit">Save workspace</button></form><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h2>Session</h2><button class="danger" data-action="logout">Log out</button></div><div class="card span-12"><h2>AI provider settings</h2><p class="tabs-note">Keys are write-only. This page never renders or persists them.</p>${state.providers.map(pv=>`<div class="row"><div><strong>${esc(pv.name)}</strong><div class="subtle">${esc(pv.status)}${pv.selected_model?' · '+esc(pv.selected_model):''}${pv.last_error_code?' · '+esc(pv.last_error_code):''}</div></div><div class="actions"><button class="secondary" data-provider="${esc(pv.id)}" data-action="credential">Set key</button><button class="secondary" data-provider="${esc(pv.id)}" data-action="verify" ${pv.credential_configured?'':'disabled'}>Verify</button><select data-provider="${esc(pv.id)}" data-action="model" ${pv.status==='verified'?'':'disabled'}><option>Select model</option>${(pv.models||[]).map(m=>`<option value="${esc(m.id)}" ${pv.selected_model===m.id?'selected':''}>${esc(m.label)}</option>`).join('')}</select></div></div>`).join('')||'<div class="empty">Provider catalog is unavailable from the authenticated API.</div>'}</div></div>`}
function connections(){return header('Connections','Connect only with platform consent.',`<button class="secondary" data-action="connect" data-platform="youtube">Connect YouTube</button>`)+`<div class="grid"><div class="card span-8"><h2>Publishing connections</h2>${state.connections.length?state.connections.map(c=>`<div class="row"><div><strong>${esc(c.platform)}</strong><div class="subtle">Account ${esc(c.account_id||'not returned')} · scopes ${Array.isArray(c.scopes)?c.scopes.length:0}</div></div><div class="actions"><span class="chip ${c.credential_status==='active'?'':'warn'}">${esc(c.credential_status)}</span><button class="danger" data-action="revoke" data-connection="${esc(c.id)}">Revoke</button></div></div>`).join(''):'<div class="empty">No publishing connections have been returned.</div>'}</div><div class="card span-4">${blocker('Schedules and post history are not listable here','The Worker exposes publish creation/attempt detail endpoints, but no workspace collection endpoint for schedules or published posts. This view will not invent a schedule, status or post URL.')}</div></div>`}
function analytics(){return header('Analytics','Use evidence, not guesses.',`<button class="primary" data-action="analytics-run">Fetch fresh analytics</button>`)+`<div class="grid"><div class="card span-8"><h2>Persisted analytics runs</h2>${state.analytics.length?state.analytics.map(run=>{const d=run.data||run;return `<div class="row"><div><strong>${esc(d.platform)} · ${esc(d.status)}</strong><div class="subtle">${esc(d.window?.start||'')} → ${esc(d.window?.end||'')} · ${Array.isArray(d.metrics)?d.metrics.length:0} metrics</div></div><span class="chip ${d.blocker?'blocked':d.status==='succeeded'?'':'warn'}">${esc(d.blocker?.code||d.status)}</span></div>`}).join(''):'<div class="empty">No analytics runs have been returned for this workspace.</div>'}</div><div class="card span-4">${blocker('No fabricated analytics','Values only appear after a connected platform run succeeds. Missing connection, scope, credential, policy permission or provider response remains an API blocker.')}</div></div>`}
function unavailable(title){const endpoint=title==='Review'?'quality-gates':title==='Production'?'production-jobs':'idea-runs';return header(title,title==='Review'?'Review only what the Worker can prove.':title==='Production'?'Production needs a real job.':'Scout ideas with evidence.')+`<div class="grid"><div class="card span-8">${blocker(`${title} collection unavailable`,'The current Worker contract does not expose a workspace collection endpoint for this resource. Enter or open a real resource ID to load its detail endpoint; no seeded records are shown.')}</div><div class="card span-4"><h2>Contract</h2><p class="code">GET /v1/${endpoint}/:id</p><p class="muted">The dashboard stays empty until a real API response exists.</p></div></div>`}
function render(){if(!state.user){authView();return}const nav=['overview','ideas','production','review','assets','analytics','connections','settings'];let content=state.page==='overview'?overview():state.page==='assets'?assets():state.page==='settings'?settings():state.page==='connections'?connections():state.page==='analytics'?analytics():unavailable(state.page==='ideas'?'Idea Scout':state.page==='production'?'Production':'Review');root.innerHTML=`<div class="shell"><header class="top"><div class="brand"><span class="mark"></span>VantaForge</div><div class="top-actions"><select class="workspace-switcher" id="workspace-select">${state.workspaces.map(w=>`<option value="${esc(w.id)}" ${w.id===state.workspace?.id?'selected':''}>${esc(w.name)}</option>`).join('')}<option value="__new">+ New workspace</option></select><span>${esc(state.user.display_name)}</span><span class="avatar">${esc(state.user.display_name.slice(0,2).toUpperCase())}</span></div></header><div class="layout"><nav>${nav.slice(0,5).map(i=>`<button class="${state.page===i?'active':''}" data-page="${i}">${i==='ideas'?'Idea Scout':i[0].toUpperCase()+i.slice(1)}</button>`).join('')}<h5>Manage</h5>${nav.slice(5).map(i=>`<button class="${state.page===i?'active':''}" data-page="${i}">${i[0].toUpperCase()+i.slice(1)}</button>`).join('')}</nav><main>${content}</main></div></div>`;bind()}
function bind(){document.querySelectorAll('[data-page]').forEach(el=>el.onclick=()=>{state.page=el.dataset.page;history.pushState({},'',`#${state.page}`);render()});const select=document.querySelector('#workspace-select');if(select)select.onchange=async()=>{if(select.value==='__new'){const name=prompt('Workspace name');if(!name)return;try{const created=await api('/v1/workspaces',{method:'POST',body:JSON.stringify({name,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone})});state.workspaces=[created,...state.workspaces];state.workspace=created;await loadWorkspace(created.id);render()}catch(e){toast(apiError(e.payload),true)}}else{await loadWorkspace(select.value);render()}};document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>action(el));const pf=document.querySelector('#policy-form');if(pf)pf.onsubmit=async e=>{e.preventDefault();const d=new FormData(pf);try{state.policy=await api(`/v1/workspaces/${state.workspace.id}/policy`,{method:'PUT',body:JSON.stringify({mode:d.get('mode'),review_mode:d.get('review_mode'),review_after_count:d.get('review_after_count')?Number(d.get('review_after_count')):null,daily_spend_limit:d.get('daily_spend_limit')?Number(d.get('daily_spend_limit')):null,per_job_cost_limit:d.get('per_job_cost_limit')?Number(d.get('per_job_cost_limit')):null,enabled_capabilities:d.getAll('capability'),stop_switch:d.get('stop_switch')==='on'})});toast('Automation policy saved')}catch(e){toast(apiError(e.payload),true)}};const wf=document.querySelector('#workspace-form');if(wf)wf.onsubmit=async e=>{e.preventDefault();try{const d=Object.fromEntries(new FormData(wf));state.workspace=await api(`/v1/workspaces/${state.workspace.id}`,{method:'PUT',body:JSON.stringify(d)});state.workspaces=state.workspaces.map(w=>w.id===state.workspace.id?state.workspace:w);render();toast('Workspace settings saved')}catch(e){toast(apiError(e.payload),true)}};document.querySelectorAll('[data-action="model"]').forEach(el=>el.onchange=()=>action(el))}
async function action(el){try{if(el.dataset.action==='logout'){await api('/v1/auth/logout',{method:'POST'});state.token=null;state.user=null;state.workspace=null;render();return}if(el.dataset.action==='credential'){const key=prompt(`Enter the ${el.dataset.provider} API key. It is sent once and never displayed.`);if(!key)return;await api(`/v1/workspaces/${state.workspace.id}/ai-providers/${el.dataset.provider}/credentials`,{method:'PUT',body:JSON.stringify({api_key:key})});toast('Credential saved as write-only configuration');await loadWorkspace(state.workspace.id);render();return}if(el.dataset.action==='verify'){await api(`/v1/workspaces/${state.workspace.id}/ai-providers/${el.dataset.provider}/verify`,{method:'POST',body:'{}'});toast('Provider verified by the Worker');await loadWorkspace(state.workspace.id);render();return}if(el.dataset.action==='model'){if(!el.value||el.value==='Select model')return;await api(`/v1/workspaces/${state.workspace.id}/ai-providers/${el.dataset.provider}/models`,{method:'PATCH',body:JSON.stringify({model:el.value})});toast('Model selection saved');await loadWorkspace(state.workspace.id);render();return}if(el.dataset.action==='revoke'){await api(`/v1/publishing-connections/${el.dataset.connection}/revoke`,{method:'POST',body:'{}'});toast('Connection revoked');await loadWorkspace(state.workspace.id);render();return}if(el.dataset.action==='connect'){const d=await api(`/v1/workspaces/${state.workspace.id}/publishing-connections/oauth`,{method:'POST',body:JSON.stringify({platform:el.dataset.platform})});if(d.authorization_url)location.href=d.authorization_url;else toast('Worker returned no authorization URL',true);return}if(el.dataset.action==='analytics-run'){const platform=prompt('Platform (youtube or instagram)');if(!['youtube','instagram'].includes(platform))return;const start=prompt('Start date (YYYY-MM-DD)');const end=prompt('End date (YYYY-MM-DD)');if(!start||!end)return;const d=await api(`/v1/workspaces/${state.workspace.id}/analytics-runs`,{method:'POST',headers:{'Idempotency-Key':crypto.randomUUID()},body:JSON.stringify({platform,start_date:start,end_date:end})});toast(`Analytics run recorded as ${d.status}`);await loadWorkspace(state.workspace.id);render();return}if(el.dataset.action==='upload-help')toast('Upload intent requires checksum, duration, dimensions and licensing metadata; this dashboard does not claim a file is ready.')}catch(e){toast(apiError(e.payload),true)}}
async function boot(){loading();try{const d=await api('/v1/auth/me');state.user=d.user;await loadWorkspaces();render()}catch(e){if(e.status===401)authView();else root.innerHTML=`<div class="auth"><div class="brand"><span class="mark"></span>VantaForge</div>${blocker('Worker unavailable',apiError(e.payload))}</div>`}}window.addEventListener('popstate',()=>{state.page=location.hash.slice(1)||'overview';render()});boot()})();
</script></body></html>
