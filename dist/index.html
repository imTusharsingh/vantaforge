<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d0f12" />
  <title>VantaForge — workspace</title>
  <style>
    :root{--bg:#0b0e10;--panel:#14181a;--line:#29302e;--text:#f5f1e8;--muted:#9ba39e;--lime:#c7f36b;--orange:#ff9d6c;--red:#ff867d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 72% -8%,#273328 0,#0b0e10 44%);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.shell{max-width:1480px;margin:auto;padding:22px 30px 50px}.top{height:58px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:800;letter-spacing:-.04em}.mark{width:30px;height:30px;border-radius:10px 10px 10px 3px;background:var(--lime);position:relative;transform:rotate(-8deg)}.mark:after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--bg);right:6px;top:7px}.top-actions{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:13px}.avatar{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#e8bf9e;color:#27170f;font-weight:800}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:42px;padding-top:30px}nav{color:var(--muted)}nav h5{margin:28px 13px 8px;color:#68716c;text-transform:uppercase;letter-spacing:.15em;font-size:10px}nav button{display:flex;width:100%;padding:11px 13px;margin:3px 0;border-radius:9px;background:transparent;color:inherit;text-align:left;align-items:center;gap:10px}nav button:hover,nav button.active{background:#202921;color:var(--lime)}main{min-width:0}.eyebrow{color:var(--lime);text-transform:uppercase;letter-spacing:.15em;font-size:10px;font-weight:800}.page-head{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:27px}.page-head h1{max-width:730px;margin:5px 0 10px;font-size:clamp(32px,4vw,53px);line-height:1.02;letter-spacing:-.06em}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:15px}.card{background:rgba(20,24,26,.88);border:1px solid var(--line);border-radius:13px;padding:20px}.span-3{grid-column:span 3}.span-4{grid-column:span 4}.span-5{grid-column:span 5}.span-7{grid-column:span 7}.span-8{grid-column:span 8}.span-12{grid-column:span 12}.card h2{margin:0 0 14px;font-size:18px}.metric{font-size:30px;font-weight:800;letter-spacing:-.06em;margin-top:9px}.label,.subtle{color:var(--muted);font-size:12px}.chip{display:inline-flex;padding:4px 8px;border-radius:99px;background:#25321f;color:var(--lime);font-size:11px;font-weight:800}.chip.warn{background:#3a281f;color:var(--orange)}.chip.blocked{background:#3a2020;color:var(--red)}.chip.neutral{background:#242a2b;color:#c3cbc5}.row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:13px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.empty{text-align:center;color:var(--muted);padding:25px 0}.notice,.blocked-box{padding:16px;border:1px solid #5f482f;background:#282019;border-radius:10px;color:#d9b99c}.notice strong,.blocked-box h3{color:#ffb783}.blocked-box h3{margin:0 0 5px}.actions{display:flex;gap:9px;flex-wrap:wrap}.primary,.secondary,.danger{padding:11px 15px;border-radius:8px;font-weight:800}.primary{background:var(--lime);color:#11150e}.secondary{background:#22292a;border:1px solid var(--line);color:var(--text)}.danger{background:#3b2020;color:var(--red);border:1px solid #673a38}.secondary:disabled,.primary:disabled{opacity:.45;cursor:not-allowed}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;background:#0f1314;border:1px solid var(--line);color:var(--text);border-radius:7px;padding:10px}.check-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.check{display:flex;gap:8px;align-items:center}.check input{accent-color:var(--lime)}.stack{display:grid;gap:14px}.auth{max-width:500px;margin:10vh auto}.auth .brand{margin-bottom:34px}.auth-card{background:rgba(20,24,26,.95);border:1px solid var(--line);border-radius:15px;padding:27px}.auth-card h1{margin:0 0 8px;font-size:32px}.auth-tabs{display:flex;gap:4px;margin:22px 0}.auth-tabs button{padding:8px 12px;border-radius:7px;background:transparent;color:var(--muted)}.auth-tabs button.active{background:#263020;color:var(--lime)}.error{color:var(--red);font-size:13px}.hidden{display:none!important}.workspace-switcher{max-width:220px;background:#101516;color:var(--text);border:1px solid var(--line);padding:8px;border-radius:7px}.tabs-note{margin:-12px 0 18px;color:var(--muted);font-size:13px}.data-table{width:100%;border-collapse:collapse;font-size:13px}.data-table th,.data-table td{text-align:left;padding:11px 7px;border-top:1px solid var(--line);vertical-align:top}.data-table th{color:var(--muted);font-weight:500}.code{font-family:ui-monospace,monospace;font-size:12px;color:#c9d6c9}.toast{position:fixed;right:22px;bottom:22px;max-width:360px;padding:13px 16px;border:1px solid var(--line);border-radius:9px;background:#202827;box-shadow:0 12px 40px #0008}.toast.bad{border-color:#6b3d3b;color:#ffafa8}@media(max-width:950px){.layout{grid-template-columns:1fr;gap:20px}.layout nav{display:flex;overflow:auto;gap:5px}.layout nav h5{display:none}.layout nav button{width:auto;white-space:nowrap}.span-3,.span-4,.span-5,.span-7,.span-8{grid-column:span 12}}@media(max-width:560px){.shell{padding:16px}.top-actions span{display:none}.page-head{display:block}.page-head .actions{margin-top:18px}.form-grid,.check-list{grid-template-columns:1fr}}
  </style>
</head>
<body><div id="root"></div><script type="module" src="./dashboard.js"></script></body>
</html>
